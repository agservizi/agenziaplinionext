# Saleor self-host on NAS (Docker Compose)
# AG SERVIZI — docs/saleor-nas.md companion stack
#
# Usage (on the NAS):
#   cp .env.example .env   # set secrets
#   docker compose up -d
#
# Expose API via reverse proxy HTTPS, e.g.:
#   https://saleor.agenziaplinio.it/graphql/

services:
  db:
    image: library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saleor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saleor}
    volumes:
      - saleor-db:/var/lib/postgresql/data
    networks:
      - saleor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saleor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - saleor-redis:/data
    networks:
      - saleor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/saleor/saleor:3.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-saleor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-saleor}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,api,saleor.agenziaplinio.it}
      ALLOWED_CLIENT_HOSTS: ${ALLOWED_CLIENT_HOSTS:-localhost,127.0.0.1,agenziaplinio.it,www.agenziaplinio.it}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://agenziaplinio.it,https://www.agenziaplinio.it,http://localhost:3000}
      DEFAULT_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-default-channel}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      ENABLE_ACCOUNT_CONFIRMATION_BY_EMAIL: "False"
      HTTP_IP_FILTER_ENABLED: "False"
      DASHBOARD_URL: ${DASHBOARD_URL:-https://saleor-dashboard.agenziaplinio.it/}
      PUBLIC_URL: ${PUBLIC_URL:-https://saleor.agenziaplinio.it/}
    ports:
      - "${SALEOR_API_PORT:-8000}:8000"
    networks:
      - saleor-net
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn saleor.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --workers 2"

  worker:
    image: ghcr.io/saleor/saleor:3.20
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-saleor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-saleor}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
    networks:
      - saleor-net
    command: celery --app=saleor.celeryconf:app worker --loglevel=info -B

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: ${PUBLIC_URL:-https://saleor.agenziaplinio.it/}graphql/
    ports:
      - "${SALEOR_DASHBOARD_PORT:-9000}:80"
    networks:
      - saleor-net

volumes:
  saleor-db:
  saleor-redis:

networks:
  saleor-net:
    driver: bridge
